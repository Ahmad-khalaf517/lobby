<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lobby</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <style>
      :root {
        color-scheme: dark;
        background: #0f1117;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      html,
      body,
      app-root {
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        background: #0f1117;
      }

      body {
        color: #f4f7fb;
      }

      app-root {
        display: block;
      }

      /*
       * Static, product-wide pre-bootstrap loader.
       * It is present in the first HTML paint, before Angular starts.
       */
      .lobby-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        box-sizing: border-box;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 24% 24%, rgba(124, 92, 252, 0.17), transparent 25rem),
          radial-gradient(circle at 78% 66%, rgba(80, 211, 235, 0.1), transparent 27rem),
          linear-gradient(180deg, #11141d 0%, #0f1117 52%, #0b0e14 100%);
        opacity: 1;
        visibility: visible;
        transition:
          opacity 220ms ease,
          visibility 0s linear 220ms;
      }

      .lobby-boot-loader--leaving {
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
      }

      .lobby-boot-atmosphere {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.014) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.014) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(circle at center, black 8%, transparent 72%);
        mask-image: radial-gradient(circle at center, black 8%, transparent 72%);
      }

      .lobby-boot-atmosphere::before,
      .lobby-boot-atmosphere::after {
        position: absolute;
        border: 1px solid rgba(164, 139, 255, 0.07);
        border-radius: 50%;
        content: '';
      }

      .lobby-boot-atmosphere::before {
        top: 16%;
        left: 12%;
        width: 18rem;
        height: 18rem;
      }

      .lobby-boot-atmosphere::after {
        right: 10%;
        bottom: 13%;
        width: 24rem;
        height: 24rem;
        border-color: rgba(80, 211, 235, 0.05);
      }

      .lobby-boot-content {
        position: relative;
        display: flex;
        width: min(22rem, calc(100vw - 3rem));
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      /* Neutral product metaphor: people and spaces connecting around one shared centre. */
      .lobby-boot-network {
        position: relative;
        width: min(17.5rem, calc(100vw - 4rem));
        aspect-ratio: 1;
      }

      .lobby-boot-network-glow {
        position: absolute;
        inset: 19%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(136, 106, 255, 0.32) 0%,
          rgba(124, 92, 252, 0.12) 43%,
          transparent 72%
        );
        filter: blur(1.15rem);
        opacity: 0.82;
        animation: lobby-network-glow 2.8s ease-in-out infinite;
      }

      .lobby-boot-links {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .lobby-boot-link {
        fill: none;
        stroke: rgba(160, 143, 229, 0.27);
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-dasharray: 3 7;
        animation: lobby-link-flow 2.4s linear infinite;
      }

      .lobby-boot-link-cyan {
        stroke: rgba(91, 205, 226, 0.25);
        animation-delay: -0.8s;
      }

      .lobby-boot-pulse {
        fill: #a68cff;
        filter: drop-shadow(0 0 5px rgba(166, 140, 255, 0.9));
        opacity: 0.9;
      }

      .lobby-boot-pulse-cyan {
        fill: #71d7ea;
        filter: drop-shadow(0 0 5px rgba(113, 215, 234, 0.8));
      }

      .lobby-boot-node {
        position: absolute;
        display: grid;
        width: 2.4rem;
        height: 2.4rem;
        box-sizing: border-box;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.085);
        border-radius: 0.82rem;
        background: linear-gradient(145deg, rgba(31, 37, 51, 0.96), rgba(16, 20, 29, 0.98));
        box-shadow:
          0 0.8rem 2rem rgba(0, 0, 0, 0.3),
          inset 0 1px rgba(255, 255, 255, 0.04);
      }

      .lobby-boot-node::before {
        width: 0.68rem;
        height: 0.68rem;
        border-radius: 50%;
        background: #987eff;
        box-shadow: 0 0 0.85rem rgba(152, 126, 255, 0.5);
        content: '';
      }

      .lobby-boot-node::after {
        position: absolute;
        inset: -0.24rem;
        border: 1px solid rgba(152, 126, 255, 0.18);
        border-radius: 1rem;
        content: '';
        opacity: 0;
        transform: scale(0.84);
        animation: lobby-node-ring 2.8s ease-out infinite;
      }

      .lobby-boot-node-one {
        top: 8%;
        left: 15%;
        animation: lobby-node-one 2.8s ease-in-out infinite;
      }

      .lobby-boot-node-two {
        top: 12%;
        right: 11%;
        animation: lobby-node-two 2.8s 0.28s ease-in-out infinite;
      }

      .lobby-boot-node-two::before,
      .lobby-boot-node-four::before {
        background: #71d7ea;
        box-shadow: 0 0 0.85rem rgba(113, 215, 234, 0.44);
      }

      .lobby-boot-node-two::after,
      .lobby-boot-node-four::after {
        border-color: rgba(113, 215, 234, 0.18);
        animation-delay: 0.28s;
      }

      .lobby-boot-node-three {
        bottom: 10%;
        left: 10%;
        animation: lobby-node-three 2.8s 0.56s ease-in-out infinite;
      }

      .lobby-boot-node-three::after {
        animation-delay: 0.56s;
      }

      .lobby-boot-node-four {
        right: 13%;
        bottom: 6%;
        animation: lobby-node-four 2.8s 0.84s ease-in-out infinite;
      }

      .lobby-boot-node-four::after {
        animation-delay: 0.84s;
      }

      .lobby-boot-space {
        position: absolute;
        top: 50%;
        left: 50%;
        display: grid;
        width: 6.65rem;
        height: 6.65rem;
        place-items: center;
        border: 1px solid rgba(181, 158, 255, 0.32);
        border-radius: 2rem;
        background: linear-gradient(145deg, rgba(35, 38, 54, 0.94), rgba(17, 20, 30, 0.98));
        box-shadow:
          0 1.3rem 4rem rgba(0, 0, 0, 0.4),
          0 0 2.4rem rgba(124, 92, 252, 0.16),
          inset 0 1px rgba(255, 255, 255, 0.06);
        transform: translate(-50%, -50%);
      }

      .lobby-boot-space::before {
        position: absolute;
        inset: 0.55rem;
        border: 1px solid rgba(255, 255, 255, 0.055);
        border-radius: 1.55rem;
        background: radial-gradient(circle at 50% 46%, rgba(158, 133, 255, 0.13), transparent 55%);
        content: '';
      }

      .lobby-boot-space::after {
        position: absolute;
        inset: -0.42rem;
        border: 1px solid rgba(161, 137, 255, 0.15);
        border-radius: 2.35rem;
        content: '';
        opacity: 0.55;
        animation: lobby-space-outline 2.8s ease-in-out infinite;
      }

      .lobby-boot-space-core {
        position: relative;
        display: grid;
        width: 2.65rem;
        height: 2.65rem;
        place-items: center;
        border: 1px solid rgba(190, 171, 255, 0.3);
        border-radius: 0.9rem;
        background: linear-gradient(145deg, rgba(138, 106, 255, 0.26), rgba(80, 211, 235, 0.08));
        box-shadow:
          0 0 1.55rem rgba(124, 92, 252, 0.28),
          inset 0 1px rgba(255, 255, 255, 0.08);
        animation: lobby-space-core 2.8s ease-in-out infinite;
      }

      .lobby-boot-space-core::before {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #b39cff;
        box-shadow:
          0 0 0.75rem rgba(179, 156, 255, 0.85),
          0 0 1.8rem rgba(124, 92, 252, 0.5);
        content: '';
      }

      .lobby-boot-space-corner {
        position: absolute;
        width: 0.8rem;
        height: 0.8rem;
        border-color: rgba(145, 119, 255, 0.48);
        border-style: solid;
      }

      .lobby-boot-space-corner-one {
        top: 0.78rem;
        left: 0.78rem;
        border-width: 1px 0 0 1px;
        border-radius: 0.3rem 0 0;
      }

      .lobby-boot-space-corner-two {
        top: 0.78rem;
        right: 0.78rem;
        border-width: 1px 1px 0 0;
        border-radius: 0 0.3rem 0 0;
      }

      .lobby-boot-space-corner-three {
        right: 0.78rem;
        bottom: 0.78rem;
        border-width: 0 1px 1px 0;
        border-radius: 0 0 0.3rem;
      }

      .lobby-boot-space-corner-four {
        bottom: 0.78rem;
        left: 0.78rem;
        border-width: 0 0 1px 1px;
        border-radius: 0 0 0 0.3rem;
      }

      .lobby-boot-label {
        margin: 0.35rem 0 0;
        color: #aab3c1;
        font-size: 0.77rem;
        font-weight: 650;
        letter-spacing: 0.025em;
      }

      .lobby-boot-subtitle {
        margin: 0.34rem 0 0;
        color: #687384;
        font-size: 0.68rem;
        letter-spacing: 0.02em;
      }

      .lobby-boot-progress {
        position: relative;
        width: 7.5rem;
        height: 2px;
        overflow: hidden;
        margin-top: 0.9rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
      }

      .lobby-boot-progress::after {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -42%;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #987eff 45%, #71d7ea 76%, transparent);
        box-shadow: 0 0 0.8rem rgba(124, 92, 252, 0.55);
        content: '';
        animation: lobby-progress 1.65s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .lobby-boot-error-message {
        display: none;
        max-width: 19rem;
        margin-top: 1rem;
        color: #bbc2cd;
        font-size: 0.78rem;
        line-height: 1.5;
      }

      .lobby-boot-error-message p {
        margin: 0;
      }

      .lobby-boot-error-message button {
        margin-top: 0.8rem;
        border: 1px solid rgba(182, 156, 255, 0.3);
        border-radius: 0.7rem;
        padding: 0.58rem 0.95rem;
        background: rgba(124, 92, 252, 0.14);
        color: #eeeaff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .lobby-boot-error-message button:focus-visible {
        outline: 2px solid #b69cff;
        outline-offset: 3px;
      }

      .lobby-boot-loader--error .lobby-boot-loading-copy,
      .lobby-boot-loader--error .lobby-boot-progress {
        display: none;
      }

      .lobby-boot-loader--error .lobby-boot-error-message {
        display: block;
      }

      .lobby-boot-loader--error .lobby-boot-network *,
      .lobby-boot-loader--error .lobby-boot-network {
        animation-play-state: paused;
      }

      @keyframes lobby-network-glow {
        0%,
        100% {
          opacity: 0.65;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.95;
          transform: scale(1.05);
        }
      }

      @keyframes lobby-link-flow {
        to {
          stroke-dashoffset: -20;
        }
      }

      @keyframes lobby-node-ring {
        0%,
        25% {
          opacity: 0;
          transform: scale(0.84);
        }
        42% {
          opacity: 0.8;
        }
        70%,
        100% {
          opacity: 0;
          transform: scale(1.2);
        }
      }

      @keyframes lobby-node-one {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(0.18rem, 0.12rem, 0);
        }
      }

      @keyframes lobby-node-two {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(-0.18rem, 0.12rem, 0);
        }
      }

      @keyframes lobby-node-three {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(0.18rem, -0.12rem, 0);
        }
      }

      @keyframes lobby-node-four {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(-0.18rem, -0.12rem, 0);
        }
      }

      @keyframes lobby-space-outline {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.97);
        }
        50% {
          opacity: 0.75;
          transform: scale(1.035);
        }
      }

      @keyframes lobby-space-core {
        0%,
        100% {
          transform: scale(0.96);
          box-shadow:
            0 0 1.2rem rgba(124, 92, 252, 0.2),
            inset 0 1px rgba(255, 255, 255, 0.08);
        }
        50% {
          transform: scale(1.04);
          box-shadow:
            0 0 2rem rgba(124, 92, 252, 0.43),
            inset 0 1px rgba(255, 255, 255, 0.1);
        }
      }

      @keyframes lobby-progress {
        0% {
          left: -42%;
        }
        100% {
          left: 100%;
        }
      }

      @media (max-width: 420px) {
        .lobby-boot-network {
          width: min(15.5rem, calc(100vw - 3rem));
        }

        .lobby-boot-node {
          width: 2.15rem;
          height: 2.15rem;
          border-radius: 0.72rem;
        }

        .lobby-boot-space {
          width: 5.9rem;
          height: 5.9rem;
          border-radius: 1.75rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .lobby-boot-network *,
        .lobby-boot-network,
        .lobby-boot-progress::after {
          animation: none !important;
        }

        .lobby-boot-loader {
          transition-duration: 1ms;
        }

        .lobby-boot-network-glow {
          opacity: 0.72;
          transform: none;
        }

        .lobby-boot-progress::after {
          left: 29%;
        }
      }
    </style>
  </head>

  <body>
    <app-root>
      <div class="lobby-boot-loader" role="status" aria-label="Loading Lobby">
        <div class="lobby-boot-atmosphere" aria-hidden="true"></div>

        <div class="lobby-boot-content">
          <div class="lobby-boot-network" aria-hidden="true">
            <span class="lobby-boot-network-glow"></span>

            <svg class="lobby-boot-links" viewBox="0 0 280 280" focusable="false">
              <path class="lobby-boot-link" d="M54 53 C86 72 105 91 126 121" />
              <path
                class="lobby-boot-link lobby-boot-link-cyan"
                d="M229 56 C198 74 177 95 154 121"
              />
              <path class="lobby-boot-link" d="M50 229 C84 208 104 186 125 158" />
              <path
                class="lobby-boot-link lobby-boot-link-cyan"
                d="M228 232 C197 209 177 187 155 158"
              />

              <circle class="lobby-boot-pulse" r="2.7">
                <animateMotion
                  dur="2.4s"
                  repeatCount="indefinite"
                  path="M54 53 C86 72 105 91 126 121"
                />
              </circle>
              <circle class="lobby-boot-pulse lobby-boot-pulse-cyan" r="2.7">
                <animateMotion
                  dur="2.4s"
                  begin="-0.8s"
                  repeatCount="indefinite"
                  path="M229 56 C198 74 177 95 154 121"
                />
              </circle>
              <circle class="lobby-boot-pulse" r="2.7">
                <animateMotion
                  dur="2.4s"
                  begin="-1.2s"
                  repeatCount="indefinite"
                  path="M50 229 C84 208 104 186 125 158"
                />
              </circle>
              <circle class="lobby-boot-pulse lobby-boot-pulse-cyan" r="2.7">
                <animateMotion
                  dur="2.4s"
                  begin="-1.8s"
                  repeatCount="indefinite"
                  path="M228 232 C197 209 177 187 155 158"
                />
              </circle>
            </svg>

            <span class="lobby-boot-node lobby-boot-node-one"></span>
            <span class="lobby-boot-node lobby-boot-node-two"></span>
            <span class="lobby-boot-node lobby-boot-node-three"></span>
            <span class="lobby-boot-node lobby-boot-node-four"></span>

            <div class="lobby-boot-space">
              <span class="lobby-boot-space-corner lobby-boot-space-corner-one"></span>
              <span class="lobby-boot-space-corner lobby-boot-space-corner-two"></span>
              <span class="lobby-boot-space-corner lobby-boot-space-corner-three"></span>
              <span class="lobby-boot-space-corner lobby-boot-space-corner-four"></span>
              <span class="lobby-boot-space-core"></span>
            </div>
          </div>

          <div class="lobby-boot-loading-copy">
            <p class="lobby-boot-label">Connecting to Lobby</p>
            <p class="lobby-boot-subtitle">Preparing your space</p>
          </div>

          <div class="lobby-boot-progress" aria-hidden="true"></div>

          <div class="lobby-boot-error-message">
            <p>Lobby could not finish opening.</p>
            <button type="button">Try again</button>
          </div>
        </div>
      </div>
    </app-root>
  </body>
</html>
