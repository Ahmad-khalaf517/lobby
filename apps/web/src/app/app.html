<app-route-progress />
<router-outlet />

<div
  class="lobby-boot-loader"
  [class.lobby-boot-loader--leaving]="loading.startup() === 'ready'"
  [class.lobby-boot-loader--error]="loading.startup() === 'error'"
  [attr.role]="
    loading.startup() === 'ready' ? null : loading.startup() === 'error' ? 'alert' : 'status'
  "
  [attr.aria-label]="
    loading.startup() === 'error'
      ? 'Lobby could not open'
      : loading.startup() === 'ready'
        ? null
        : 'Loading Lobby'
  "
  [attr.aria-hidden]="loading.startup() === 'ready' ? 'true' : null"
  [attr.inert]="loading.startup() === 'ready' ? '' : null"
>
  <div class="lobby-boot-atmosphere" aria-hidden="true"></div>
  <div class="lobby-boot-content">
    <div class="lobby-boot-conversation" aria-hidden="true">
      <span class="lobby-boot-conversation-glow"></span>

      <div class="lobby-boot-message lobby-boot-message-back">
        <span class="lobby-boot-mini-avatar"></span>
        <span class="lobby-boot-mini-line"></span>
        <span class="lobby-boot-notification-dot"></span>
      </div>

      <div class="lobby-boot-message lobby-boot-message-main">
        <span class="lobby-boot-avatar">
          <span class="lobby-boot-status"></span>
        </span>
        <span class="lobby-boot-message-copy">
          <span class="lobby-boot-sender-line"></span>
          <span class="lobby-boot-text-line lobby-boot-text-line-long"></span>
          <span class="lobby-boot-text-line lobby-boot-text-line-short"></span>
          <span class="lobby-boot-typing"> <span></span><span></span><span></span> </span>
        </span>
      </div>

      <span class="lobby-boot-incoming-pulse"></span>
    </div>

    <p class="lobby-boot-label lobby-boot-loading-label">Opening the conversation</p>

    <div class="lobby-boot-error-message">
      <p>Lobby could not finish opening.</p>
      <button type="button" (click)="reload()">Try again</button>
    </div>
  </div>
</div>
