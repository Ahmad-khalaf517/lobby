<button
  type="button"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel()"
  [disabled]="disabled()"
  (click)="toggle()"
  class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface disabled:cursor-not-allowed disabled:opacity-50"
  [class.bg-primary]="checked()"
  [class.bg-app-border]="!checked()"
>
  <span
    class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
    [class.translate-x-6]="checked()"
    [class.translate-x-1]="!checked()"
  ></span>
</button>
