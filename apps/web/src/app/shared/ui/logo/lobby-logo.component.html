<svg
  [attr.viewBox]="viewBox"
  [style.width.px]="size()"
  [style.height.px]="size()"
  preserveAspectRatio="xMidYMid meet"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  [attr.role]="decorative() ? null : 'img'"
  [attr.aria-label]="decorative() ? null : label()"
  [attr.aria-hidden]="decorative() ? 'true' : null"
>
  <defs>
    <linearGradient [attr.id]="gradientId" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" [attr.stop-color]="gradientStart" />
      <stop offset="100%" [attr.stop-color]="gradientEnd" />
    </linearGradient>
  </defs>

  <path [attr.d]="silhouettePath" [attr.fill]="'url(#' + gradientId + ')'" />
  <path [attr.d]="basePath" [attr.fill]="'url(#' + gradientId + ')'" />
</svg>
