<footer
  class="flex shrink-0 flex-wrap items-center gap-3 border-t border-white/7 bg-[#141821] px-4 py-3 sm:px-6"
>
  <div class="flex min-w-0 items-center gap-2.5">
    <app-chat-avatar [name]="currentUserName()" size="sm" [elevated]="true" />
    <span class="hidden max-w-40 truncate text-xs font-medium text-[#edf0f4] md:inline">
      {{ currentUserName() }}
    </span>
  </div>

  <div class="flex items-center gap-2.5">
    <app-call-icon
      [type]="micEnabled() ? 'mic' : 'mic-off'"
      variant="solid"
      size="lg"
      shape="circle"
      [active]="micEnabled()"
      [disabled]="micPending() || !enabled()"
      [label]="micEnabled() ? 'Mute microphone' : 'Unmute microphone'"
      (click)="toggleMic.emit()"
    />

    <app-call-icon
      [type]="cameraEnabled() ? 'video' : 'camera-off'"
      variant="solid"
      size="lg"
      shape="circle"
      [active]="cameraEnabled()"
      [disabled]="!enabled()"
      [label]="cameraEnabled() ? 'Turn camera off' : 'Turn camera on'"
      (click)="toggleCamera.emit()"
    />

    <app-call-icon
      [type]="screenShareActive() ? 'screen-share-off' : 'screen-share'"
      variant="solid"
      size="lg"
      shape="circle"
      [active]="screenShareActive()"
      [disabled]="screenSharePending() || !enabled()"
      [label]="screenShareActive() ? 'Stop screen sharing' : 'Share your screen'"
      (click)="toggleScreenShare.emit()"
    />
  </div>

  <span class="min-w-0 flex-1"></span>

  <ng-content select="[call-control-input]" />

  <button
    type="button"
    (click)="invite.emit()"
    class="inline-flex h-10 shrink-0 items-center gap-2 rounded-full border border-[#8f74ff]/45 bg-[#8f74ff]/20 px-4 text-xs font-semibold text-[#f4f1ff] transition hover:bg-[#8f74ff]/30"
  >
    <app-call-icon
      type="users"
      size="sm"
      [label]="inviteCopied() ? 'Invite copied' : 'Invite friends'"
    />
    {{ inviteCopied() ? 'Invite copied' : 'Invite' }}
  </button>

  <app-call-icon
    type="leave"
    variant="danger"
    size="lg"
    shape="circle"
    label="Leave call"
    (click)="leave.emit()"
  />
</footer>
