<header
  class="flex shrink-0 items-center gap-3 border-b border-white/7 bg-[#141821] px-4 py-3 sm:px-6"
>
  <div class="flex min-w-0 flex-1 items-center gap-3">
    <app-chat-avatar [name]="currentUserName()" size="md" [elevated]="true" />

    <div class="min-w-0">
      <div class="flex items-center gap-2">
        <h1 class="truncate text-sm font-semibold text-white">{{ roomName() }}</h1>
        <span
          class="rounded-md border border-[#8f74ff]/40 bg-[#8f74ff]/15 px-1.5 py-0.5 text-[9px] font-semibold tracking-[0.14em] text-[#c9bbff] uppercase"
        >
          Guest
        </span>
      </div>
      <p class="mt-0.5 flex items-center gap-2 text-[11px] font-medium text-[#a0a9b7]">
        {{ subtitle() }}
        <span class="text-[#4d5566]">·</span>
        {{ participantCount() }} participant{{ participantCount() === 1 ? '' : 's' }}
        <span class="text-[#4d5566]">·</span>
        <span class="tabular-nums">{{ formattedTime() }}</span>
      </p>
    </div>
  </div>

  @if (pillState(); as pill) {
    <div
      class="hidden shrink-0 items-center gap-1.5 rounded-full border px-2.5 py-1.5 text-[10px] font-medium sm:flex"
      [class]="pill.tone"
    >
      <app-call-icon [type]="pill.icon" size="sm" [label]="pill.label" />
      {{ pill.label }}
    </div>
  }

  <button
    type="button"
    (click)="invite.emit()"
    class="inline-flex h-9 shrink-0 items-center gap-2 rounded-lg border border-[#8f74ff]/45 bg-[#8f74ff]/20 px-3.5 text-xs font-semibold text-[#f4f1ff] transition hover:bg-[#8f74ff]/30"
  >
    <app-call-icon type="users" size="sm" label="Invite friends" />
    <span class="hidden sm:inline">Invite friends</span>
  </button>

  <button
    type="button"
    (click)="leave.emit()"
    aria-label="Leave call"
    class="grid size-8 shrink-0 place-items-center rounded-lg border border-white/8 bg-white/[0.03] text-[#c8cfdb] transition hover:border-white/20 hover:bg-white/10 hover:text-white"
  >
    <app-call-icon type="close" size="sm" label="Leave call" />
  </button>
</header>
