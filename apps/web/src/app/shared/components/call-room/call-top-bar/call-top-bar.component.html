<header
  class="flex shrink-0 items-center gap-3 border-b border-white/8 bg-[#12161f]/90 px-4 py-3 backdrop-blur-xl sm:px-6"
>
  <div class="flex min-w-0 flex-1 items-center gap-3">
    <app-chat-avatar [name]="currentUserName()" size="md" [elevated]="true" />

    <div class="min-w-0">
      <div class="flex items-center gap-2">
        <h1 class="truncate text-sm font-semibold text-white">{{ roomName() }}</h1>
        <span
          class="rounded-md border border-[#7c5cfc]/40 bg-[#7c5cfc]/15 px-1.5 py-0.5 text-[9px] font-semibold tracking-[0.14em] text-[#c4b8ff] uppercase"
        >
          Guest
        </span>
      </div>
      <p class="mt-0.5 flex items-center gap-2 text-[11px] font-medium text-[#8b95a6]">
        {{ subtitle() }}
        <span class="text-[#4d5566]">·</span>
        {{ participantCount() }} participant{{ participantCount() === 1 ? '' : 's' }}
        <span class="text-[#4d5566]">·</span>
        <span class="tabular-nums">{{ formattedTime() }}</span>
      </p>
    </div>
  </div>

  @if (pillState(); as pill) {
    <div
      class="hidden shrink-0 items-center gap-1.5 rounded-full border px-3 py-1.5 text-[10px] font-medium sm:flex"
      [class]="pill.tone"
    >
      <app-call-icon [type]="pill.icon" size="sm" [label]="pill.label" />
      {{ pill.label }}
    </div>
  }
</header>
