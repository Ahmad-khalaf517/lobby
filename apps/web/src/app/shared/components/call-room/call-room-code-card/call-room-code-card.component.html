<section
  class="relative overflow-hidden rounded-[1.35rem] border border-primary/20 bg-[linear-gradient(145deg,rgba(124,92,252,0.12),rgba(20,25,38,0.72))] p-4 shadow-[0_18px_45px_rgba(0,0,0,0.22)]"
>
  <div
    class="pointer-events-none absolute -top-10 -right-10 size-28 rounded-full bg-primary/15 blur-3xl"
    aria-hidden="true"
  ></div>
  <div class="relative flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-[10px] font-semibold tracking-[0.16em] text-[#9f8dff] uppercase">
        {{ label() }}
      </p>
      <p class="mt-1 text-xs leading-5 text-[#8994a7]">Share this link with people you trust.</p>
    </div>
    <span
      class="grid size-9 shrink-0 place-items-center rounded-xl border border-primary/20 bg-primary/10 text-[#c7bcff]"
      aria-hidden="true"
    >
      <app-icon name="lock" [size]="16" />
    </span>
  </div>

  @if (value()) {
    <p
      class="relative mt-3 truncate rounded-xl border border-white/8 bg-[#0d121c]/72 px-3 py-2.5 font-mono text-[10px] text-[#dfe5ef]"
    >
      {{ value() }}
    </p>
  } @else {
    <p
      class="relative mt-3 truncate rounded-xl border border-white/8 bg-[#0d121c]/72 px-3 py-2.5 text-[10px] text-[#677386]"
    >
      {{ emptyText() }}
    </p>
  }

  <button
    type="button"
    (click)="onCopy()"
    class="relative mt-3 inline-flex h-10 w-full items-center justify-center gap-2 rounded-xl border border-primary/25 bg-primary/12 text-xs font-semibold text-[#ddd6ff] transition hover:border-primary/40 hover:bg-primary/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/45"
  >
    <app-icon name="copy" [size]="16" />
    {{ copied() ? copiedLabel() : copyLabel() }}
  </button>
</section>
