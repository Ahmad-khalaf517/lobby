<div
  class="rounded-2xl border border-[#7c5cfc]/30 bg-[linear-gradient(180deg,rgba(124,92,252,0.12),rgba(124,92,252,0.03))] p-3.5"
>
  <p class="text-[11px] font-semibold tracking-[0.08em] text-[#c9bbff] uppercase">
    {{ label() }}
  </p>

  @if (value()) {
    <p
      class="mt-2 truncate rounded-lg border border-white/8 bg-[#101524] px-2.5 py-2 font-mono text-[11px] text-[#dfe4ef]"
    >
      {{ value() }}
    </p>
  } @else {
    <p
      class="mt-2 truncate rounded-lg border border-white/8 bg-[#101524] px-2.5 py-2 text-[11px] text-[#687282]"
    >
      {{ emptyText() }}
    </p>
  }

  <button
    type="button"
    (click)="onCopy()"
    class="mt-3 inline-flex h-9 w-full items-center justify-center gap-2 rounded-lg border border-[#8f74ff]/45 bg-[#8f74ff]/20 text-xs font-semibold text-[#f4f1ff] transition hover:bg-[#8f74ff]/30"
  >
    <app-call-icon type="copy" size="sm" [label]="copied() ? copiedLabel() : copyLabel()" />
    {{ copied() ? copiedLabel() : copyLabel() }}
  </button>
</div>
