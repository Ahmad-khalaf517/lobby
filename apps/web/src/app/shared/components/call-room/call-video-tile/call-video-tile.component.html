<div
  class="group relative aspect-video overflow-hidden rounded-2xl border bg-[#10141d] shadow-[0_10px_30px_rgba(0,0,0,0.25)]"
  [class]="
    isLocal()
      ? 'border-[#7c5cfc]/50'
      : participant().isSpeaking
        ? 'border-[#22c55e]/50'
        : 'border-white/10'
  "
>
  @if (cameraVisible()) {
    <video #videoEl class="h-full w-full object-cover" autoplay playsinline muted></video>
  } @else {
    <div
      class="grid h-full w-full place-items-center"
      [class]="
        participant().isSpeaking
          ? 'bg-[radial-gradient(circle_at_50%_45%,rgba(124,92,252,0.16),transparent_65%)]'
          : ''
      "
    >
      <app-chat-avatar [name]="participant().name" size="lg" [elevated]="true" />
    </div>
  }

  <div
    class="pointer-events-none absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-black/70 to-transparent"
    aria-hidden="true"
  ></div>

  <div class="absolute inset-x-0 bottom-0 flex items-center gap-2 p-2.5">
    <span
      class="inline-flex max-w-full items-center gap-2 rounded-lg border border-white/10 bg-[#0b0e14]/70 px-2 py-1 backdrop-blur-md"
    >
      <span
        [class]="
          'size-1.5 shrink-0 rounded-full ' +
          (participant().isSpeaking
            ? 'bg-[#22c55e] shadow-[0_0_6px_rgba(34,197,94,0.9)]'
            : 'bg-[#5b6474]')
        "
      ></span>
      <span class="truncate text-[11px] font-medium text-white">
        {{ participant().name }}
      </span>
      @if (participant().isLocal) {
        <span class="text-[9px] font-semibold tracking-[0.1em] text-[#a78bfa] uppercase">You</span>
      }
    </span>

    <span class="ml-auto shrink-0 rounded-lg bg-black/40 p-1 backdrop-blur-sm">
      @if (participant().isMicMuted) {
        <app-call-icon type="mic-off" size="sm" [label]="participant().name + ' is muted'" />
      } @else {
        <app-call-icon type="mic" size="sm" [label]="participant().name + ' is unmuted'" />
      }
    </span>
  </div>
</div>
