<div
  class="group relative overflow-hidden rounded-[1.4rem] border bg-[linear-gradient(145deg,rgba(27,33,48,0.96),rgba(13,17,27,0.96))] shadow-[0_18px_55px_rgba(0,0,0,0.28)] transition duration-300"
  [class]="
    participant().isSpeaking
      ? 'border-emerald-400/55 ring-1 ring-emerald-400/20'
      : participant().isLocal
        ? 'border-primary/45'
        : 'border-white/9 hover:border-white/16'
  "
>
  <div
    class="pointer-events-none absolute inset-0 opacity-0 transition duration-300 group-hover:opacity-100"
    [class]="
      participant().isSpeaking
        ? 'bg-[radial-gradient(circle_at_50%_18%,rgba(34,197,94,0.16),transparent_52%)] opacity-100'
        : 'bg-[radial-gradient(circle_at_50%_18%,rgba(124,92,252,0.13),transparent_58%)]'
    "
    aria-hidden="true"
  ></div>

  <div
    [class]="
      compact()
        ? 'flex items-center gap-3 px-3.5 py-3'
        : 'grid min-h-44 place-items-center px-5 py-7'
    "
  >
    <div class="relative shrink-0">
      <div
        class="rounded-full transition duration-300"
        [class]="participant().isSpeaking ? 'ring-4 ring-emerald-400/20' : ''"
      >
        <app-chat-avatar
          [name]="participant().name"
          [size]="compact() ? 'md' : 'lg'"
          [elevated]="true"
          status="online"
        />
      </div>
      @if (participant().isSpeaking) {
        <span
          class="absolute -right-1 -bottom-1 size-3 rounded-full border-2 border-[#111622] bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.9)]"
        ></span>
      }
    </div>

    <div [class]="compact() ? 'min-w-0 flex-1' : 'mt-4 min-w-0 text-center'">
      <div class="flex items-center gap-2" [class.justify-center]="!compact()">
        <p class="truncate text-sm font-semibold text-white">{{ participant().name }}</p>
        @if (participant().isLocal) {
          <span
            class="rounded-full border border-primary/30 bg-primary/10 px-2 py-0.5 text-[9px] font-semibold tracking-[0.12em] text-[#c8bbff] uppercase"
            >You</span
          >
        }
      </div>
      <p class="mt-1 text-[11px] text-[#7f8a9c]">
        {{
          participant().isSpeaking
            ? 'Speaking now'
            : participant().isMicMuted
              ? 'Microphone muted'
              : 'Listening'
        }}
      </p>
    </div>

    <div [class]="compact() ? 'ml-auto' : 'absolute top-3 right-3'">
      <span
        class="grid size-8 place-items-center rounded-full border border-white/8 bg-black/20 text-[#9aa5b7] backdrop-blur"
        [attr.aria-label]="
          participant().isMicMuted
            ? participant().name + ' is muted'
            : participant().name + ' is unmuted'
        "
      >
        <app-icon [name]="participant().isMicMuted ? 'mic-off' : 'mic'" [size]="16" />
      </span>
    </div>
  </div>
</div>
