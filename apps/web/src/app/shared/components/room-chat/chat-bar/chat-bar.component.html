<form
  (submit)="onSubmit($event)"
  class="flex shrink-0 items-end gap-2 border-t border-white/7 bg-[#141821] p-3 sm:p-4"
>
  <div class="relative flex-1">
    <input
      #composerInput
      type="text"
      [formControl]="control"
      [maxlength]="maxLength()"
      [placeholder]="placeholder()"
      autocomplete="off"
      (input)="onComposerInput()"
      (keydown)="onMentionKeydown($event)"
      (blur)="onComposerBlur()"
      class="h-11 w-full rounded-xl border border-white/10 bg-[#1a1f2b] px-3.5 text-sm text-app-foreground placeholder:text-[#687282] outline-none focus:border-[#8f74ff]/60 focus:ring-2 focus:ring-[#8f74ff]/20"
    />

    @if (mentionQuery() !== null && mentionSuggestions().length > 0) {
      <div
        class="absolute right-0 bottom-[calc(100%+0.5rem)] left-0 z-20 overflow-hidden rounded-xl border border-white/12 bg-[#1a1f2b] py-1 shadow-[0_24px_50px_rgba(0,0,0,0.45)]"
        role="listbox"
        aria-label="Mention a member"
      >
        @for (
          suggestion of mentionSuggestions();
          track suggestion.kind + suggestion.name;
          let i = $index
        ) {
          <button
            type="button"
            role="option"
            (mousedown)="$event.preventDefault()"
            (click)="insertMention(suggestion.name)"
            [attr.aria-selected]="i === mentionHighlightIndex()"
            [class]="
              'flex w-full items-center gap-2 px-3 py-2 text-left text-sm transition ' +
              (i === mentionHighlightIndex()
                ? 'bg-white/10 text-white'
                : 'text-[#c8cfdb] hover:bg-white/6')
            "
          >
            <app-chat-avatar
              [name]="suggestion.kind === 'all' ? 'all' : suggestion.name"
              size="xs"
              [initialsOverride]="suggestion.kind === 'all' ? 'ALL' : null"
              [backgroundOverride]="suggestion.kind === 'all' ? 'rgba(143,116,255,0.2)' : null"
              [borderColorOverride]="suggestion.kind === 'all' ? 'rgba(143,116,255,0.4)' : null"
              [textColorOverride]="suggestion.kind === 'all' ? '#c9bbff' : null"
            />
            <span>
              @if (suggestion.kind === 'all') {
                All members
              } @else {
                @{{ suggestion.name }}
              }
            </span>
          </button>
        }
      </div>
    }
  </div>

  <div #emojiPickerHost class="relative">
    <button
      type="button"
      (click)="toggleEmojiPicker()"
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-white/12 bg-white/[0.045] text-[#c8cfdb] transition hover:border-white/22 hover:bg-white/10 hover:text-white"
      aria-label="Open emoji picker"
      [attr.aria-expanded]="emojiPickerOpen()"
      aria-haspopup="true"
    >
      <svg viewBox="0 0 24 24" class="size-5" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
        <path
          d="M9.2 10.5a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4ZM14.8 10.5a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z"
          fill="currentColor"
        />
        <path
          d="M8.2 14.2c.9 1.3 2.2 2 3.8 2s2.9-.7 3.8-2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>

    @if (emojiPickerOpen()) {
      <div
        class="absolute right-0 bottom-[calc(100%+0.6rem)] z-20 w-56 rounded-xl border border-white/12 bg-[#1a1f2b] p-2 shadow-[0_24px_50px_rgba(0,0,0,0.45)]"
        role="menu"
        aria-label="Emoji picker"
      >
        <div class="grid grid-cols-6 gap-1">
          @for (emoji of emojis(); track emoji) {
            <button
              type="button"
              (click)="selectEmoji(emoji)"
              class="flex h-8 w-8 items-center justify-center rounded-lg text-lg transition hover:bg-white/10"
              [attr.aria-label]="'Insert emoji ' + emoji"
            >
              {{ emoji }}
            </button>
          }
        </div>
      </div>
    }
  </div>

  <button
    type="submit"
    [disabled]="!canSend()"
    class="flex h-11 shrink-0 items-center justify-center gap-2 rounded-xl bg-primary px-4 text-sm font-semibold text-white transition hover:bg-[#8b6dff] disabled:pointer-events-none disabled:opacity-40"
  >
    Send
  </button>
</form>
