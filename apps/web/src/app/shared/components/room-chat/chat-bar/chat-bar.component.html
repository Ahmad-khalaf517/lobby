<form
  (submit)="onSubmit($event)"
  class="flex shrink-0 items-end gap-2 border-t border-white/7 bg-[#0e131d]/92 p-3 backdrop-blur-xl"
>
  <div class="relative min-w-0 flex-1">
    <input
      #composerInput
      type="text"
      [formControl]="control"
      [maxlength]="maxLength()"
      [placeholder]="placeholder()"
      autocomplete="off"
      (input)="onComposerInput()"
      (keydown)="onMentionKeydown($event)"
      (blur)="onComposerBlur()"
      class="h-11 w-full rounded-2xl border border-white/9 bg-[#151b27] px-4 pr-11 text-sm text-[#eef1f6] outline-none transition placeholder:text-[#596679] hover:border-white/14 focus:border-primary/45 focus:ring-4 focus:ring-primary/8"
    />

    @if (mentionQuery() !== null && mentionSuggestions().length > 0) {
      <div
        class="absolute right-0 bottom-[calc(100%+0.6rem)] left-0 z-20 overflow-hidden rounded-2xl border border-white/10 bg-[#171d29] py-1.5 shadow-[0_28px_60px_rgba(0,0,0,0.5)]"
        role="listbox"
        aria-label="Mention a member"
      >
        @for (
          suggestion of mentionSuggestions();
          track suggestion.kind + suggestion.name;
          let i = $index
        ) {
          <button
            type="button"
            role="option"
            (mousedown)="$event.preventDefault()"
            (click)="insertMention(suggestion.name)"
            [attr.aria-selected]="i === mentionHighlightIndex()"
            [class]="
              'flex w-full items-center gap-2.5 px-3 py-2.5 text-left text-sm transition ' +
              (i === mentionHighlightIndex()
                ? 'bg-primary/12 text-white'
                : 'text-[#c8cfdb] hover:bg-white/5')
            "
          >
            <app-chat-avatar
              [name]="suggestion.kind === 'all' ? 'all' : suggestion.name"
              size="xs"
              [initialsOverride]="suggestion.kind === 'all' ? 'ALL' : null"
              [backgroundOverride]="suggestion.kind === 'all' ? 'rgba(143,116,255,0.2)' : null"
              [borderColorOverride]="suggestion.kind === 'all' ? 'rgba(143,116,255,0.4)' : null"
              [textColorOverride]="suggestion.kind === 'all' ? '#c9bbff' : null"
            />
            <span>{{ suggestion.kind === 'all' ? 'All members' : '@' + suggestion.name }}</span>
          </button>
        }
      </div>
    }
  </div>

  <div #emojiPickerHost class="relative">
    <button
      type="button"
      (click)="toggleEmojiPicker()"
      class="grid size-11 shrink-0 place-items-center rounded-2xl border border-white/9 bg-white/[0.04] text-[#aab4c3] transition hover:border-white/16 hover:bg-white/[0.08] hover:text-white"
      aria-label="Open emoji picker"
      [attr.aria-expanded]="emojiPickerOpen()"
      aria-haspopup="true"
    >
      <app-icon name="smile" [size]="20" />
    </button>

    @if (emojiPickerOpen()) {
      <div
        class="absolute right-0 bottom-[calc(100%+0.65rem)] z-20 w-56 rounded-2xl border border-white/10 bg-[#171d29] p-2 shadow-[0_28px_60px_rgba(0,0,0,0.5)]"
        role="menu"
        aria-label="Emoji picker"
      >
        <div class="grid grid-cols-6 gap-1">
          @for (emoji of emojis(); track emoji) {
            <button
              type="button"
              (click)="selectEmoji(emoji)"
              class="grid size-8 place-items-center rounded-lg text-lg transition hover:bg-white/10"
              [attr.aria-label]="'Insert emoji ' + emoji"
            >
              {{ emoji }}
            </button>
          }
        </div>
      </div>
    }
  </div>

  <button
    type="submit"
    [disabled]="!canSend()"
    class="grid size-11 shrink-0 place-items-center rounded-2xl bg-primary text-white shadow-[0_12px_28px_rgba(124,92,252,0.25)] transition hover:-translate-y-0.5 hover:bg-[#8b6dff] disabled:pointer-events-none disabled:opacity-35"
    aria-label="Send message"
  >
    <app-icon name="send" [size]="18" />
  </button>
</form>
