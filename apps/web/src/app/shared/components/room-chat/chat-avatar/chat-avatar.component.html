@if (showImage()) {
  <img
    [src]="avatarUrl()"
    alt=""
    class="absolute inset-0 h-full w-full rounded-[inherit] object-cover"
    (error)="onImageError()"
  />
} @else {
  {{ initials() }}
}
@if (status(); as s) {
  <span
    class="pointer-events-none"
    [class]="statusDotClass()"
    [attr.aria-label]="s === 'online' ? 'Online' : s === 'muted' ? 'Muted' : 'Offline'"
    role="img"
  ></span>
}
