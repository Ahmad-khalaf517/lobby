<div class="relative flex">
  <button
    type="button"
    (click)="onTrashClick()"
    aria-label="Delete message"
    title="Delete"
    class="grid size-7 place-items-center rounded-md text-[#c5919b] outline-none transition-colors hover:bg-rose-400/10 hover:text-rose-200 focus-visible:bg-rose-400/10 focus-visible:text-rose-200"
  >
    <app-icon name="delete" class="size-3.5" />
  </button>

  @if (confirmOpen) {
    <div
      class="absolute right-0 top-9 z-30 w-48 rounded-xl border border-white/9 bg-[#171e2a]/98 p-2.5 shadow-[0_18px_42px_rgba(0,0,0,0.42)] backdrop-blur-xl"
    >
      <p class="px-1 pb-2.5 text-xs text-[#c8cfdb]">Delete this message?</p>
      <div class="flex gap-1.5">
        <button
          type="button"
          (click)="dismiss()"
          class="h-8 flex-1 rounded-lg border border-white/8 bg-white/2.5 px-2 text-xs font-medium text-[#c8cfdb] transition-colors hover:bg-white/[0.07]"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="confirmDelete()"
          class="h-8 flex-1 rounded-lg bg-rose-500/90 px-2 text-xs font-semibold text-white transition-colors hover:bg-rose-500"
        >
          Delete
        </button>
      </div>
    </div>
  }
</div>
