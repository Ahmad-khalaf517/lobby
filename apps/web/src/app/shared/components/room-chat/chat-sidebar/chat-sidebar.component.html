@if (infoBannerText(); as bannerText) {
  <div class="shrink-0 border-b border-white/[0.06] bg-primary/[0.035] px-4 py-2.5">
    <p class="flex items-start gap-2 text-[11px] leading-5 text-[#8f9bad]">
      <app-icon name="info" class="mt-0.5 size-3.5 shrink-0 text-[#9c88ff]" />
      <span>{{ bannerText }}</span>
    </p>
  </div>
}

<div
  #messagesContainer
  (scroll)="onMessagesScroll()"
  class="lobby-scrollbar min-h-0 flex-1 overflow-y-auto px-2 py-4 sm:px-3"
>
  @if (messages().length === 0) {
    <div
      [class]="
        emptyStateVariant() === 'channel'
          ? 'mx-auto w-full max-w-[856px] px-[18px] py-8 text-left'
          : 'grid min-h-64 place-items-center px-4 py-10 text-center'
      "
    >
      <div>
        <span
          [class.mx-auto]="emptyStateVariant() === 'centered'"
          class="grid size-11 place-items-center rounded-xl border border-white/[0.06] bg-surface text-[#a99bff]"
        >
          <app-icon [name]="emptyStateVariant() === 'channel' ? 'hash' : 'chat'" [size]="16" />
        </span>
        @if (emptyStateTitle()) {
          <p class="mt-4 text-lg font-semibold text-app-foreground">{{ emptyStateTitle() }}</p>
        }
        <p
          [class.max-w-60]="emptyStateVariant() === 'centered'"
          [class.mt-4]="!emptyStateTitle()"
          [class.mt-1.5]="!!emptyStateTitle()"
          class="text-[12px] leading-5 text-app-muted"
        >
          {{ emptyStateSubtitle() }}
        </p>
      </div>
    </div>
  }

  <div class="mx-auto w-full max-w-[856px] space-y-4">
    @for (message of messages(); track message.id) {
      <app-chat-message
        [message]="message"
        [currentUserId]="currentUserId()"
        [memberNames]="memberNames()"
        [reactionMenuOpen]="reactionMenuOpenMessageId() === message.id"
        (reply)="reply.emit($event)"
        (toggleReactionMenu)="toggleReactionMenu.emit($event)"
        (react)="react.emit($event)"
        (delete)="delete.emit($event)"
        (edit)="edit.emit($event)"
      />
    }
  </div>

  <div #scrollAnchor></div>
</div>

<div class="relative shrink-0">
  @if (showScrollToNewest()) {
    <button
      type="button"
      (click)="jumpToNewestMessage()"
      class="absolute -top-12 left-1/2 z-20 flex h-8 -translate-x-1/2 items-center gap-1.5 whitespace-nowrap rounded-full border border-white/[0.09] bg-[#171e2a]/96 px-3 text-[11px] font-medium text-[#d9deea] shadow-[0_12px_30px_rgba(0,0,0,0.42)] backdrop-blur-xl transition hover:bg-[#1d2635] hover:text-white"
    >
      <app-icon name="chevron-down" class="size-3.5" />
      @if (unreadCount() > 0) {
        <span>{{ unreadCount() }} new message{{ unreadCount() === 1 ? '' : 's' }}</span>
      } @else {
        <span>Jump to latest</span>
      }
    </button>
  }

  @if (replyPreview(); as preview) {
    <app-chat-reply [preview]="preview" (cancelReply)="cancelReply.emit()" />
  }

  <app-chat-bar
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [memberNames]="memberNames()"
    [emojis]="emojis()"
    (send)="send.emit($event)"
  />
</div>
