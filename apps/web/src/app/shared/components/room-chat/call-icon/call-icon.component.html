<button
  type="button"
  [class]="classes()"
  [disabled]="disabled()"
  [attr.aria-label]="label()"
  [attr.aria-disabled]="disabled() ? 'true' : null"
  [attr.aria-pressed]="active() ? 'true' : null"
>
  @switch (type()) {
    @case ('video') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <path
          d="m16 10 5.5-3.5a1 1 0 0 1 1.5.86v9.28a1 1 0 0 1-1.5.86L16 14"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <rect x="2" y="6" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.8" />
      </svg>
    }

    @case ('camera-off') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <path
          d="m16 10 5.5-3.5a1 1 0 0 1 1.5.86v9.28a1 1 0 0 1-1.5.86L16 14"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <rect x="2" y="6" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.8" />
        <path d="M2 2l20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    }

    @case ('mic') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <path
          d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <path
          d="M19 10v2a7 7 0 0 1-14 0v-2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path d="M12 19v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    }

    @case ('mic-off') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <path
          d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <path
          d="M19 10v2a7 7 0 0 1-14 0v-2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path d="M12 19v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="m3 3 18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    }

    @case ('screen-share') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <path
          d="m9 10 3-3 3 3"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path d="M12 13V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8" />
        <path d="M12 17v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="M8 21h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    }

    @case ('screen-share-off') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <path d="M12 13V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8" />
        <path d="M12 17v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="M8 21h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="m3 3 18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    }

    @case ('copy') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8" />
        <path
          d="M5 15V5a2 2 0 0 1 2-2h10"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }

    @case ('close') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <path
          d="M18 6 6 18M6 6l12 12"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    }

    @case ('lock') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <rect x="3" y="11" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.8" />
        <path
          d="M7 11V7a5 5 0 0 1 10 0v4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    }

    @case ('users') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <path
          d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.8" />
        <path
          d="M22 21v-2a4 4 0 0 0-3-3.87"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="1.8" />
      </svg>
    }

    @case ('reconnecting') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <path
          d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M3 3v5h5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M16 16h5v5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }

    @case ('leave') {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <path
          d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.34 1.77.65 2.6a2 2 0 0 1-.45 2.11L8 9.99a16 16 0 0 0 6 6l1.56-1.31a2 2 0 0 1 2.11-.45c.83.31 1.7.53 2.6.65A2 2 0 0 1 22 16.92z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path d="M2 2 22 22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    }

    @default {
      <svg viewBox="0 0 24 24" [class]="sizeIconClass[size()]" fill="none" aria-hidden="true">
        <path
          d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.34 1.77.65 2.6a2 2 0 0 1-.45 2.11L8 9.99a16 16 0 0 0 6 6l1.56-1.31a2 2 0 0 1 2.11-.45c.83.31 1.7.53 2.6.65A2 2 0 0 1 22 16.92z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }
  }
</button>
