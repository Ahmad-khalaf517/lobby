@if (mode() === 'chips') {
  <div class="mt-2 flex flex-wrap gap-1.5">
    @for (reaction of message().reactions; track reaction.emoji) {
      <button
        type="button"
        (click)="onReact(reaction.emoji)"
        [class]="
          'inline-flex items-center gap-1 rounded-full border px-2 py-1 text-[11px] transition hover:bg-white/10 ' +
          (reaction.reactedByMe
            ? 'border-[#8f74ff]/50 bg-[#8f74ff]/15 text-[#f4f1ff]'
            : 'border-white/10 bg-white/[0.04] text-[#dbe2ed]')
        "
        [attr.aria-label]="'Toggle ' + reaction.emoji + ' reaction'"
      >
        <span>{{ reaction.emoji }}</span>
        <span class="text-[10px] text-[#9aa4b3]">{{ reaction.count }}</span>
      </button>
    }
  </div>
} @else {
  <button
    type="button"
    (click)="onToggleMenu()"
    data-message-react-button
    aria-label="React to message"
    class="grid size-7 place-items-center rounded-full border border-white/10 bg-white/[0.04] text-[#c8cfdb] transition hover:border-white/20 hover:bg-white/10 hover:text-white"
  >
    <app-icon name="smile" [size]="14" />
  </button>

  @if (menuOpen()) {
    <div
      data-message-reaction-menu
      class="absolute right-0 top-9 z-20 flex items-center gap-1 rounded-2xl border border-white/10 bg-[#141821] p-1.5 shadow-[0_18px_40px_rgba(0,0,0,0.35)]"
    >
      @for (emoji of emojis(); track emoji) {
        <button
          type="button"
          (click)="onReact(emoji)"
          [class]="
            'grid size-8 place-items-center rounded-xl text-base transition hover:bg-white/10 ' +
            (message().ownReaction === emoji ? 'bg-white/14 ring-1 ring-white/25' : '')
          "
          [attr.aria-label]="'React with ' + emoji"
        >
          {{ emoji }}
        </button>
      }
    </div>
  }
}
