<div class="flex min-h-0 min-w-0 flex-1 flex-col">
  <header
    class="grid shrink-0 grid-cols-[1fr_auto_1fr] items-center border-b border-white/7 bg-[#141821] px-4 py-3 sm:px-6"
  >
    <div class="col-start-1 flex justify-self-start">
      <ng-content select="[chat-header-leading]" />
    </div>

    <div class="col-start-2 max-w-full justify-self-center px-2 text-center">
      <p class="max-w-full truncate text-sm font-semibold text-white">{{ title() }}</p>
      @if (subtitle()) {
        <p class="mt-0.5 max-w-full truncate text-[10px] font-medium text-[#a0a9b7]">
          {{ subtitle() }}
        </p>
      }
    </div>

    <div class="col-start-3 flex items-center justify-self-end gap-2">
      <ng-content select="[chat-header-extra]" />
      @if (showCloseButton()) {
        <button
          type="button"
          (click)="onClose()"
          aria-label="Close chat"
          class="grid size-8 place-items-center rounded-lg border border-white/8 bg-white/[0.03] text-[#c8cfdb] transition hover:border-white/20 hover:bg-white/10 hover:text-white"
        >
          <svg viewBox="0 0 24 24" class="size-4" fill="none" aria-hidden="true">
            <path
              d="M18 6 6 18M6 6l12 12"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </button>
      }
    </div>
  </header>

  <app-chat-sidebar
    [infoBannerText]="infoBannerText()"
    [messages]="messages()"
    [currentUserId]="currentUserId()"
    [memberNames]="memberNames()"
    [reactionMenuOpenMessageId]="openReactionMenuId()"
    [replyPreview]="pendingReply()"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    [emojis]="emojis()"
    (send)="onSend($event)"
    (reply)="onReply($event)"
    (toggleReactionMenu)="onToggleReactionMenu($event)"
    (react)="onReact($event)"
    (delete)="onDelete($event)"
    (edit)="onEdit($event)"
    (cancelReply)="onCancelReply()"
  ></app-chat-sidebar>
</div>
