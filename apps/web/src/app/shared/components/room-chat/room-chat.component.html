<div class="flex min-h-0 min-w-0 flex-1 flex-col bg-[#0d121b]/72">
  <header
    class="flex min-h-[4.75rem] shrink-0 items-center gap-3 border-b border-white/7 bg-[#0e131d]/82 px-4 backdrop-blur-xl"
  >
    <div class="flex shrink-0 items-center"><ng-content select="[chat-header-leading]" /></div>

    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-semibold text-white">{{ title() }}</p>
      @if (subtitle()) {
        <p class="mt-1 truncate text-[10px] font-medium text-[#748095]">{{ subtitle() }}</p>
      }
    </div>

    <div class="flex shrink-0 items-center gap-2">
      <ng-content select="[chat-header-extra]" />
      @if (showCloseButton()) {
        <button
          type="button"
          (click)="onClose()"
          aria-label="Close chat"
          class="grid size-9 place-items-center rounded-xl border border-white/8 bg-white/[0.035] text-[#aeb8c7] transition hover:border-white/16 hover:bg-white/[0.08] hover:text-white"
        >
          <app-icon name="close" [size]="16" />
        </button>
      }
    </div>
  </header>

  <app-chat-sidebar
    [infoBannerText]="infoBannerText()"
    [messages]="messages()"
    [currentUserId]="currentUserId()"
    [memberNames]="memberNames()"
    [reactionMenuOpenMessageId]="openReactionMenuId()"
    [replyPreview]="pendingReply()"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    [emojis]="emojis()"
    (send)="onSend($event)"
    (reply)="onReply($event)"
    (toggleReactionMenu)="onToggleReactionMenu($event)"
    (react)="onReact($event)"
    (delete)="onDelete($event)"
    (edit)="onEdit($event)"
    (cancelReply)="onCancelReply()"
  ></app-chat-sidebar>
</div>
