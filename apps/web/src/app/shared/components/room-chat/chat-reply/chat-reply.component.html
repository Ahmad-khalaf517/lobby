@if (preview(); as preview) {
  <div class="mx-3 mb-2 rounded-xl border border-white/12 bg-[#1a2030] px-3 py-2 sm:mx-4">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <p class="text-[10px] font-semibold tracking-[0.08em] text-[#a0a9b7] uppercase">
          Replying to {{ preview.authorName }}
        </p>
        <p class="mt-1 truncate text-xs text-[#d8deea]">{{ preview.text }}</p>
      </div>
      <button
        type="button"
        (click)="cancelReply.emit()"
        class="shrink-0 rounded-md p-1 text-[#7d8898] transition hover:bg-white/10 hover:text-white"
        aria-label="Cancel reply"
      >
        <app-icon name="close" [size]="14" />
      </button>
    </div>
  </div>
} @else {
  <button
    type="button"
    (click)="onReply()"
    aria-label="Reply to message"
    class="grid size-7 place-items-center rounded-full border border-white/10 bg-white/[0.04] text-[#c8cfdb] transition hover:border-white/20 hover:bg-white/10 hover:text-white"
  >
    <app-icon name="reply" [size]="14" />
  </button>
}
