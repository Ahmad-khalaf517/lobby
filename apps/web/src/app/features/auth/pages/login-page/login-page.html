<header>
  <p class="text-sm font-semibold tracking-[0.16em] text-[#9d85ff] uppercase">Member access</p>
  <h2 class="mt-3 text-3xl font-semibold tracking-[-0.035em] text-white sm:text-4xl">
    Welcome back
  </h2>
  <p class="mt-3 text-sm leading-6 text-app-muted">Sign in to continue to your Lobby workspace.</p>
</header>

@if (generalError(); as error) {
  <div
    #errorAlert
    class="mt-6 rounded-xl border border-destructive/30 bg-destructive/8 px-4 py-3 text-sm leading-6 text-[#f6b5b5] focus:outline-none focus-visible:ring-2 focus-visible:ring-destructive/50"
    role="alert"
    tabindex="-1"
  >
    {{ error }}
  </div>
}

<form class="mt-7 space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div>
    <label class="auth-label" for="login-email">Email address</label>
    <input
      #emailInput
      id="login-email"
      class="auth-input"
      [class.auth-input-error]="fieldError('email')"
      type="email"
      inputmode="email"
      autocomplete="email"
      autocapitalize="none"
      spellcheck="false"
      formControlName="email"
      placeholder="you@example.com"
      [attr.aria-invalid]="fieldError('email') ? 'true' : null"
      [attr.aria-describedby]="fieldError('email') ? 'login-email-error' : null"
      (blur)="validateField()"
      (input)="handleFieldInput()"
    />
    @if (fieldError('email'); as error) {
      <p id="login-email-error" class="auth-field-error">{{ error }}</p>
    }
  </div>

  <div>
    <div class="mb-2 flex items-center justify-between gap-4">
      <label class="auth-label mb-0" for="login-password">Password</label>
      <a
        routerLink="/forgot-password"
        class="text-xs font-semibold text-[#a89af0] transition hover:text-white focus-visible:rounded focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#b69cff]/70"
      >
        Forgot password?
      </a>
    </div>
    <div class="relative">
      <input
        #passwordInput
        id="login-password"
        class="auth-input pr-20"
        [class.auth-input-error]="fieldError('password')"
        [type]="passwordVisible() ? 'text' : 'password'"
        autocomplete="current-password"
        formControlName="password"
        placeholder="Enter your password"
        [attr.aria-invalid]="fieldError('password') ? 'true' : null"
        [attr.aria-describedby]="fieldError('password') ? 'login-password-error' : null"
        (blur)="validateField()"
        (input)="handleFieldInput()"
      />
      <button
        class="absolute inset-y-0 right-0 px-4 text-xs font-semibold text-[#a89af0] transition hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-[#b69cff]/70"
        type="button"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="passwordVisible()"
        (click)="togglePasswordVisibility()"
      >
        {{ passwordVisible() ? 'Hide' : 'Show' }}
      </button>
    </div>
    @if (fieldError('password'); as error) {
      <p id="login-password-error" class="auth-field-error">{{ error }}</p>
    }
  </div>

  <button class="auth-submit" type="submit" [disabled]="isSubmitting()">
    @if (isSubmitting()) {
      <span class="auth-spinner" aria-hidden="true"></span>
      Signing in…
    } @else {
      Sign in
    }
  </button>
</form>

<p class="mt-7 text-center text-sm text-[#8f99a8]">
  New to Lobby?
  <a
    routerLink="/register"
    class="font-semibold text-[#aa98ff] transition hover:text-white focus-visible:rounded focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#b69cff]/70"
  >
    Create an account
  </a>
</p>
