<main
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-app-background px-4 py-12 text-app-foreground sm:px-6"
>
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_18%,rgba(124,92,252,0.16),transparent_38%)]"
    aria-hidden="true"
  ></div>
  <div class="relative w-full max-w-md">
    <div class="mb-7 flex flex-col items-center gap-4 text-center">
      <a
        routerLink="/"
        class="inline-flex items-center gap-3 rounded-xl"
        aria-label="Return to Lobby home"
      >
        <app-logo [size]="28" />
        <span class="text-lg font-semibold text-white">Lobby</span>
      </a>
      <div>
        <h1 class="text-2xl font-semibold text-white">Guest channels</h1>
        <p class="mt-1.5 text-sm leading-6 text-[#a0a9b7]">
          Join with an invite code or create a temporary room.
        </p>
      </div>
    </div>

    <div
      class="space-y-4 rounded-2xl border border-white/10 bg-[#141821] p-5 shadow-[0_25px_70px_rgba(0,0,0,.34)] sm:p-6"
    >
      @if (requiresDisplayName()) {
        <form [formGroup]="identityForm" class="space-y-2">
          <label for="displayName" class="block text-xs font-medium text-[#737e8e]"
            >Display name</label
          >
          <input
            id="displayName"
            formControlName="displayName"
            [maxlength]="maxNameLength"
            autocomplete="off"
            placeholder="e.g. Mohammad"
            class="h-11 w-full rounded-xl border border-white/10 bg-[#1a1f2b] px-3.5 text-sm outline-none focus:border-[#8f74ff]/60"
          />
        </form>
      } @else {
        <p class="rounded-xl border border-white/7 bg-white/2.5 px-3.5 py-3 text-xs text-[#a0a9b7]">
          Your registered profile name will be used.
        </p>
      }

      @if (errorMessage(); as error) {
        <p
          class="rounded-xl border border-destructive/25 bg-destructive/8 px-3.5 py-3 text-sm text-[#f4b8b8]"
        >
          {{ error }}
        </p>
      }

      <form
        [formGroup]="joinForm"
        (ngSubmit)="joinChannel()"
        class="space-y-3 border-t border-white/8 pt-4"
      >
        <label
          for="inviteCode"
          class="block text-xs font-medium tracking-[0.08em] text-[#737e8e] uppercase"
          >Invite code</label
        >
        <input
          id="inviteCode"
          formControlName="inviteCode"
          autocomplete="off"
          placeholder="ABC12345"
          class="h-11 w-full rounded-xl border border-white/10 bg-[#1a1f2b] px-3.5 font-mono text-sm uppercase outline-none focus:border-[#8f74ff]/60"
        />
        <button
          type="submit"
          [disabled]="submitting()"
          class="flex h-11 w-full items-center justify-center rounded-xl bg-primary text-sm font-semibold text-white disabled:opacity-40"
        >
          Join channel
        </button>
      </form>

      <form
        [formGroup]="createForm"
        (ngSubmit)="createChannel()"
        class="space-y-3 border-t border-white/8 pt-4"
      >
        <label
          for="channelName"
          class="block text-xs font-medium tracking-[0.08em] text-[#737e8e] uppercase"
          >New channel name</label
        >
        <input
          id="channelName"
          formControlName="channelName"
          [maxlength]="maxChannelNameLength"
          autocomplete="off"
          placeholder="Project review"
          class="h-11 w-full rounded-xl border border-white/10 bg-[#1a1f2b] px-3.5 text-sm outline-none focus:border-[#8f74ff]/60"
        />
        <button
          type="submit"
          [disabled]="submitting()"
          class="flex h-11 w-full items-center justify-center rounded-xl border border-primary/50 text-sm font-semibold text-[#d9d0ff] disabled:opacity-40"
        >
          Create temporary channel
        </button>
      </form>
    </div>
  </div>
</main>
