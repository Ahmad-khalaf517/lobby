<header class="sticky top-0 z-50 border-b border-white/7 bg-app-background/88 backdrop-blur-xl">
  <div class="mx-auto flex h-18 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="group inline-flex items-center gap-3" aria-label="Lobby home">
      <app-logo [size]="28" />
      <span class="text-lg font-semibold tracking-[-0.02em] text-white">Lobby</span>
    </a>

    <nav
      class="hidden items-center gap-7 text-sm text-[#a0a9b7] md:flex"
      aria-label="Primary navigation"
    >
      <a href="#why-lobby" class="transition hover:text-white">Why Lobby</a>
      <a href="#guest-access" class="transition hover:text-white">For guests</a>
      <a href="#member-experience" class="transition hover:text-white">For members</a>
      <a href="#security" class="transition hover:text-white">Security</a>
      <a href="#faq" class="transition hover:text-white">FAQ</a>
    </nav>

    <div class="flex items-center gap-2">
      <a
        routerLink="/login"
        class="hidden rounded-xl px-4 py-2.5 text-sm font-medium text-[#cbd2dc] transition hover:bg-white/5 hover:text-white sm:inline-flex"
      >
        Sign in
      </a>
      <a
        routerLink="/register"
        class="hidden rounded-xl border border-white/10 bg-white/[0.035] px-4 py-2.5 text-sm font-semibold text-[#e7eaf0] transition hover:border-white/20 hover:bg-white/6 sm:inline-flex"
      >
        Create account
      </a>
      <a
        routerLink="/guests"
        class="inline-flex items-center justify-center rounded-xl bg-primary px-4 py-2.5 text-sm font-semibold text-white shadow-[0_10px_30px_rgba(124,92,252,0.24)] transition hover:bg-[#8b6dff] focus:outline-none focus:ring-2 focus:ring-[#b69cff]/70"
      >
        Join a Channel
      </a>
    </div>
  </div>
</header>
