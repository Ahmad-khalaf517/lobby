@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4"
    (click)="onBackdropClick($event)"
  >
    <div
      class="flex w-full max-w-2xl h-[32rem] rounded-2xl border border-app-border bg-surface shadow-2xl overflow-hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Settings"
    >
      <!-- Sidebar -->
      <nav class="w-48 shrink-0 border-r border-app-border bg-app-background/40 p-3 flex flex-col">
        <p class="px-2 pt-1 pb-2 text-xs font-semibold uppercase tracking-wide text-app-muted">
          Settings
        </p>

        @for (item of navItems; track item.section) {
          <button type="button" [class]="navItemClasses(item.section)" (click)="goTo(item.section)">
            {{ item.label }}
          </button>
        }

        <div class="mt-auto pt-2 border-t border-app-border">
          @if (logoutError()) {
            <p class="px-2 pb-1 text-xs text-destructive">{{ logoutError() }}</p>
          }
          <button
            type="button"
            class="w-full text-left rounded-lg px-3 py-2 text-sm font-medium text-destructive hover:bg-destructive/10 transition-colors disabled:opacity-50"
            [disabled]="isLoggingOut()"
            (click)="logout()"
          >
            {{ isLoggingOut() ? 'Logging out…' : 'Log out' }}
          </button>
        </div>
      </nav>

      <!-- Content -->
      <div class="flex-1 min-w-0 flex flex-col">
        <div class="flex items-center justify-end px-6 pt-4">
          <button
            type="button"
            class="rounded-lg p-1 text-app-muted hover:text-app-foreground hover:bg-surface-hover transition-colors"
            aria-label="Close"
            (click)="close()"
          >
            ✕
          </button>
        </div>

        <div class="flex-1 overflow-y-auto px-6 pb-6">
          @switch (activeSection()) {
            @case ('profile') {
              <app-profile-panel />
            }
            @case ('general') {
              <app-general-panel />
            }
            @case ('change-password') {
              <app-change-password-panel />
            }
          }
        </div>
      </div>
    </div>
  </div>
}
