@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4"
    (click)="onBackdropClick($event)"
  >
    <div
      class="flex w-full max-w-2xl h-128 rounded-2xl border border-app-border bg-surface shadow-2xl overflow-hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Settings"
    >
      <!-- Sidebar -->
      <nav class="w-48 shrink-0 border-r border-app-border bg-app-background/40 p-3 flex flex-col">
        <p class="px-2 pt-1 pb-2 text-xs font-semibold uppercase tracking-wide text-app-muted">
          Settings
        </p>

        @for (item of navItems; track item.section) {
          <button type="button" [class]="navItemClasses(item.section)" (click)="goTo(item.section)">
            <app-icon [name]="item.icon" [size]="16" />
            {{ item.label }}
          </button>
        }
      </nav>

      <!-- Content -->
      <div class="flex-1 min-w-0 flex flex-col">
        <div class="flex items-center justify-end px-4 pt-4">
          <button
            type="button"
            class="grid size-8 shrink-0 place-items-center rounded-lg text-app-muted hover:text-app-foreground hover:bg-surface-hover transition-colors"
            aria-label="Close settings"
            (click)="close()"
          >
            <app-icon name="close" [size]="16" />
          </button>
        </div>

        <div class="flex-1 overflow-y-auto px-6 pb-6">
          @switch (activeSection()) {
            @case ('general') {
              <app-general-panel />
            }
            @case ('change-password') {
              <app-change-password-panel />
            }
          }
        </div>
      </div>
    </div>
  </div>
}
