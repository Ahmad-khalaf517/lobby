<h2 class="text-base font-semibold text-app-foreground mb-1">Change password</h2>
<p class="text-xs text-app-muted mb-5">
  Use at least 8 characters and choose something you do not reuse elsewhere.
</p>

@if (generalError(); as error) {
  <div
    class="mb-5 rounded-xl border border-destructive/30 bg-destructive/8 px-4 py-3 text-sm leading-6 text-[#f6b5b5]"
    role="alert"
  >
    {{ error }}
  </div>
}

<form [formGroup]="form" [attr.aria-busy]="saving()" (ngSubmit)="save()" novalidate>
  <label class="auth-label" for="settings-new-password">New password</label>
  <div class="relative">
    <input
      #passwordInput
      id="settings-new-password"
      class="auth-input pr-20"
      [class.auth-input-error]="fieldError('password')"
      [type]="passwordVisible() ? 'text' : 'password'"
      autocomplete="new-password"
      formControlName="password"
      placeholder="At least 8 characters"
      [attr.aria-invalid]="fieldError('password') ? 'true' : null"
      [attr.aria-describedby]="fieldError('password') ? 'settings-new-password-error' : null"
      (blur)="validateField()"
      (input)="handleFieldInput()"
    />
    <button
      class="absolute inset-y-0 right-0 px-4 text-xs font-semibold text-[#a89af0] transition hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-[#b69cff]/70 disabled:cursor-not-allowed disabled:opacity-60"
      type="button"
      [disabled]="saving()"
      [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="passwordVisible()"
      (click)="togglePasswordVisibility()"
    >
      {{ passwordVisible() ? 'Hide' : 'Show' }}
    </button>
  </div>
  @if (fieldError('password'); as error) {
    <p id="settings-new-password-error" class="auth-field-error">{{ error }}</p>
  }

  <label class="auth-label mt-4" for="settings-confirm-password">Confirm new password</label>
  <div class="relative">
    <input
      #confirmPasswordInput
      id="settings-confirm-password"
      class="auth-input pr-20"
      [class.auth-input-error]="fieldError('confirmPassword')"
      [type]="confirmPasswordVisible() ? 'text' : 'password'"
      autocomplete="new-password"
      formControlName="confirmPassword"
      placeholder="Repeat your new password"
      [attr.aria-invalid]="fieldError('confirmPassword') ? 'true' : null"
      [attr.aria-describedby]="
        fieldError('confirmPassword') ? 'settings-confirm-password-error' : null
      "
      (blur)="validateField()"
      (input)="handleFieldInput()"
    />
    <button
      class="absolute inset-y-0 right-0 px-4 text-xs font-semibold text-[#a89af0] transition hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-[#b69cff]/70 disabled:cursor-not-allowed disabled:opacity-60"
      type="button"
      [disabled]="saving()"
      [attr.aria-label]="
        confirmPasswordVisible() ? 'Hide password confirmation' : 'Show password confirmation'
      "
      [attr.aria-pressed]="confirmPasswordVisible()"
      (click)="toggleConfirmPasswordVisibility()"
    >
      {{ confirmPasswordVisible() ? 'Hide' : 'Show' }}
    </button>
  </div>
  @if (fieldError('confirmPassword'); as error) {
    <p id="settings-confirm-password-error" class="auth-field-error">{{ error }}</p>
  }

  <button class="auth-submit mt-5" type="submit" [disabled]="saving()">
    @if (saving()) {
      <span class="auth-spinner" aria-hidden="true"></span>
      Updating password…
    } @else {
      Update password
    }
  </button>
</form>
