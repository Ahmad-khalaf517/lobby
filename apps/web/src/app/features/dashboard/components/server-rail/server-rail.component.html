@if (mobileOpen()) {
  <button
    type="button"
    (click)="closeMobile.emit()"
    aria-label="Close sidebar"
    class="fixed inset-0 z-30 bg-black/60 lg:hidden"
  ></button>
}

<aside
  class="fixed inset-y-0 left-0 z-40 flex w-57.5 -translate-x-full flex-col border-r border-[#232a38] bg-[#11161f] py-4 transition-transform duration-200 lg:static lg:z-auto lg:w-16 lg:translate-x-0"
  [class.translate-x-0]="mobileOpen()"
>
  <div class="px-4 pb-3 pt-1 lg:hidden">
    <p class="truncate text-xs font-semibold text-app-foreground">Spaces</p>
    <p class="mt-1 truncate text-[10px] text-app-muted/75">Your communities</p>
  </div>

  <nav aria-label="Spaces" class="min-h-0 flex-1 space-y-1 overflow-y-auto px-2 lobby-scrollbar">
    @for (server of store.servers(); track server.id) {
      <a
        [routerLink]="serverLink(server)"
        [attr.aria-current]="server.id === activeServerId() ? 'page' : null"
        [attr.aria-label]="server.name"
        [title]="server.name"
        class="relative flex h-12 items-center gap-3 rounded-xl px-2 transition lg:justify-center"
        [class.hover:bg-surface-hover]="server.id !== activeServerId()"
      >
        <span
          aria-hidden="true"
          class="absolute -left-2 top-1/2 w-1 -translate-y-1/2 rounded-r-full bg-primary transition-all duration-200"
          [class.h-6]="server.id === activeServerId()"
          [class.h-0]="server.id !== activeServerId()"
        ></span>
        <app-server-icon [name]="server.name" size="md" [active]="server.id === activeServerId()" />
        <span
          class="truncate text-[13px] lg:hidden"
          [class.text-[#d9d2ff]]="server.id === activeServerId()"
          [class.font-medium]="server.id === activeServerId()"
          [class.text-app-muted]="server.id !== activeServerId()"
          >{{ server.name }}</span
        >
      </a>
    }

    <a
      routerLink="/app/friends"
      routerLinkActive
      #friendsLink="routerLinkActive"
      title="Friends"
      class="relative flex h-12 items-center gap-3 rounded-xl px-2 transition hover:bg-surface-hover lg:justify-center"
      [class.text-app-foreground]="friendsLink.isActive"
      [class.text-app-muted]="!friendsLink.isActive"
    >
      <span
        aria-hidden="true"
        class="absolute -left-2 top-1/2 w-1 -translate-y-1/2 rounded-r-full bg-primary transition-all duration-200"
        [class.h-6]="friendsLink.isActive"
        [class.h-0]="!friendsLink.isActive"
      ></span>
      <div
        class="grid size-8 shrink-0 place-items-center rounded-lg bg-surface transition"
        [class.ring-2]="friendsLink.isActive"
        [class.ring-primary/60]="friendsLink.isActive"
      >
        <app-icon name="users" [size]="16" />
      </div>
      <span class="truncate text-[13px] lg:hidden" [class.font-medium]="friendsLink.isActive"
        >Friends</span
      >
    </a>
  </nav>

  <div class="relative mt-2 shrink-0 px-2">
    <button
      type="button"
      (click)="toggleAddMenu()"
      title="New space"
      class="flex h-11 w-full items-center gap-3 rounded-xl border border-dashed border-app-border px-2 text-[12px] text-app-muted transition hover:border-primary/40 hover:bg-primary/10 hover:text-app-foreground lg:justify-center"
    >
      <span class="grid size-7 shrink-0 place-items-center rounded-lg bg-surface">
        <app-icon name="plus" [size]="14" />
      </span>
      <span class="lg:hidden">New space</span>
    </button>

    @if (addMenuOpen()) {
      <div
        class="absolute bottom-[calc(100%+8px)] left-1 z-30 w-64 space-y-1 rounded-2xl border border-[#232a38] bg-[#0d121b] p-2 shadow-2xl"
      >
        <p class="px-2 pb-1 pt-1 text-[10px] font-semibold tracking-wide text-app-muted uppercase">
          Add a space
        </p>
        <button
          type="button"
          (click)="createServer()"
          class="flex w-full items-start gap-3 rounded-xl px-2 py-2.5 text-left transition hover:bg-surface-hover"
        >
          <span
            class="grid size-9 shrink-0 place-items-center rounded-xl bg-primary/15 text-primary"
          >
            <app-icon name="plus" [size]="16" />
          </span>
          <span class="min-w-0 pt-0.5">
            <span class="block text-[13px] font-medium text-app-foreground">Create a space</span>
            <span class="block text-[11px] text-app-muted">Start fresh with your own channels</span>
          </span>
        </button>
        <button
          type="button"
          (click)="joinServer()"
          class="flex w-full items-start gap-3 rounded-xl px-2 py-2.5 text-left transition hover:bg-surface-hover"
        >
          <span
            class="grid size-9 shrink-0 place-items-center rounded-xl bg-surface text-app-muted"
          >
            <app-icon name="link" [size]="16" />
          </span>
          <span class="min-w-0 pt-0.5">
            <span class="block text-[13px] font-medium text-app-foreground"
              >Join with invite code</span
            >
            <span class="block text-[11px] text-app-muted"
              >Enter a code from someone else's space</span
            >
          </span>
        </button>
      </div>
    }
  </div>
</aside>
