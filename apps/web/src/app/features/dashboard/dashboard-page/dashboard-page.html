<div class="flex h-dvh overflow-hidden bg-app-background">
  <app-server-rail
    [activeServerId]="activeServerId()"
    [mobileOpen]="mobileSidebarOpen()"
    (closeMobile)="mobileSidebarOpen.set(false)"
  />

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <app-dashboard-header [activeServer]="activeServer()" (menuToggle)="toggleMobileSidebar()" />

    <main class="flex min-h-0 min-w-0 flex-1 overflow-hidden">
      <router-outlet />
    </main>
  </div>
</div>

@if (store.createModalOpen()) {
  <app-create-server-modal />
}
@if (store.joinModalOpen()) {
  <app-join-server-modal />
}
